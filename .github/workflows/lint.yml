name: Linter
run-name: Linting by ${{ github.actor }}
on:
  push:
    branches:
      - master
      - development
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12